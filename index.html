<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fotogram</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./logos/favicon.png" type="image/x-icon">
  <script src="script.js"></script>
</head>
<body onload="renderPictures()">
  <header>
    <button class="header_btn"><a href="#"><img class="header_img" src="./logos/logo.png"
          alt="firmenlogo Fotogram"></a></button>
  </header>
  <main id="main-wrapper">
    <h1>Your pesonal photo album</h1>
    <section id="photo_gallery">
      <dialog id="imageOverlay" aria-labelledby="image-title" aria-describedby="">
        <header id="overlayHeader">
          <h2 class="image-title"></h2>
          <button class="exit-btn" aria-label="Dialog schließen" onclick="closeDialog()"><img src="./assets/close.png"
              alt=""></button>
        </header>
        <main id="showImage">

        </main>
        <footer id="overlay_footer">
          <button class="left-btn" aria-label="Vorheriges Bild"><img class="left-btn-img" src="./assets/arrow.png"
              alt=""></button>
          <p id="img_counter" aria-label="Anzahl der Fotos `${[index]}`"></p>
          <button class="right-btn" aria-label="Nächstes Bild"><img class="right-btn-img" src="./assets/arrow.png"
              alt=""></button>
        </footer>
      </dialog>
    </section>
  </main>
  <footer id="main_footer">
    <button class="footer_btn"><a target="_blank" tabindex="0" href="https://developerakademie.com/"><img
          class="footer_img" src="./logos/footer_img.png" alt="firmenlogo Devepoer Akademie "></a></button>
  </footer>
</body>
</html>
